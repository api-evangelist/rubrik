apis:
- aid: rubrik:rubrik-security-cloud-api
  name: Rubrik Security Cloud API
  description: >-
    The Rubrik Security Cloud (RSC) API is a single-endpoint GraphQL API at /api/graphql that exposes
    the full RSC platform, including SLA domain management and assignment, on-demand backups, recovery
    operations, data security posture, data threat analytics, observability, SaaS app protection, and
    reporting. The API is introspectable and is supported by an in-product API Playground IDE.
  humanURL: https://developer.rubrik.com/Rubrik-Security-Cloud-API/
  tags:
  - Backup
  - Cyber Recovery
  - Data Security Posture
  - GraphQL
  - Threat Analytics
