aid: rubrik
name: Rubrik
description: >-
  Rubrik is a Zero Trust data security company that protects enterprise, cloud,
  and SaaS data with backup, recovery, threat analytics, data security posture
  management, and cyber recovery workflows through Rubrik Security Cloud (RSC)
  and on-premises Rubrik clusters. Rubrik publishes a comprehensive developer
  program including the Rubrik Security Cloud GraphQL API at /api/graphql, the
  legacy Rubrik Cluster REST API (v1, v2, and internal endpoints), an
  interactive API Playground, a PowerShell module, a Terraform provider, and
  Postman collections through the Rubrik Developer Center at
  developer.rubrik.com.
