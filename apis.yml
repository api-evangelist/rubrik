- aid: rubrik:rubrik-cluster-api
  name: Rubrik Cluster API
  description: >-
    REST API exposed by on-premises Rubrik clusters (CDM) with v1, v2, and internal endpoints for managing
    protected objects, SLA domains, backup jobs, recovery, cluster configuration, events, and reports.
    Provides the foundation for the rubrik-sdk-for-python and rubrik-sdk-for-powershell tooling.
  humanURL: https://developer.rubrik.com/Rubrik-Cluster-API/
  tags:
